version: "3.8"

services:
  ros:
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: my_robot_jazzy:dev
    container_name: my_robot_ros
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - QT_QPA_PLATFORM=xcb
      - HOME=/tmp

    volumes:
      - ..:/workspace:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/bus/usb:/dev/bus/usb:rw

    device_cgroup_rules:
      - 'c 189:* rmw'

    # For Intel/AMD GPU acceleration using Mesa (common on Linux)
    devices:
      - /dev/dri:/dev/dri

    group_add:
      - video
      - dialout
      - plugdev

    stdin_open: true
    tty: true
    working_dir: /workspace
    command: bash
